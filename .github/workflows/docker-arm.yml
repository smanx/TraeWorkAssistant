# Docker ARM64 打包工作流（GitHub Actions 类型脚本，手动触发）
# 目标：补齐现有 docker-image.yml 未覆盖的 ARM 架构——产出 linux/arm64 镜像并推送 GHCR。
# 机制：GitHub 只在默认分支（main）展示 “Run workflow” 按钮与分支选择器；实际运行时会执行所选
#       分支上「同路径」的工作流文件。因此 main 分支必须放置与本文件同名的占位入口
#       （.github/workflows/docker-arm.yml），同名才能在分支选择器中切到 docker_main 运行。
# 用法：Actions → Docker Image (ARM64) → Run workflow → 分支选 docker_main
#       → 在原生 ARM runner 上构建 linux/arm64 镜像。
# 说明：仅构建 ARM64；amd64 由 docker-image.yml 的推送流水线负责，标签以 -arm64 后缀区分避免冲突。
#       不修改任何源码，仅新增本工作流文件。
name: Docker Image (ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-arm64:
    name: 构建并推送 ARM64 镜像（GHCR）
    # 公共仓库免费的原生 ARM runner，避免 QEMU 模拟下 Rust + rusqlite(bundled) 的极慢编译
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Docker ref 强制小写：github.repository（如 smart-open/TraeWorkAssistant）须转小写，
      # 否则 buildx 报 invalid reference format
      - name: 计算小写镜像名
        id: img
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本号取 package.json（scripts/sync_version.mjs 单一来源维护）
      - name: 读取项目版本
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 计算镜像标签（-arm64 后缀，避免与多架构 manifest 冲突）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.image }}
          tags: |
            type=raw,value=arm64
            type=raw,value=${{ steps.ver.outputs.version }}-arm64
            type=ref,event=branch,suffix=-arm64
            type=sha,format=short,suffix=-arm64

      - name: 构建并推送 ARM64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache 按平台隔离 scope，避免与 docker-image.yml 的缓存互相覆盖
          cache-from: type=gha,scope=build-arm64
          cache-to: type=gha,mode=max,scope=build-arm64
